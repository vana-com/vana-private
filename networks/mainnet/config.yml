PRESET_BASE: mainnet
CONFIG_NAME: vana

# Same as Ethereum Mainnet
# ---------------------------------------------------------------
# 2**8 (= 256) epochs ~205 minutes
MIN_VALIDATOR_WITHDRAWABILITY_DELAY: 256
# 2**8 (= 256) epochs ~205 minutes
SHARD_COMMITTEE_PERIOD: 256
# 2**2 (= 4)
INACTIVITY_SCORE_BIAS: 4
# 2**4 (= 16)
INACTIVITY_SCORE_RECOVERY_RATE: 16

# Transition
# ---------------------------------------------------------------
TERMINAL_TOTAL_DIFFICULTY: 20000000

# Genesis
# ---------------------------------------------------------------
MIN_GENESIS_ACTIVE_VALIDATOR_COUNT: 1
MIN_GENESIS_TIME: 0
GENESIS_FORK_VERSION: 0x20000089
# 120 seconds (2 minutes)
GENESIS_DELAY: 120
SECONDS_PER_ETH1_BLOCK: 6

# Forking
# ---------------------------------------------------------------
# Altair
ALTAIR_FORK_EPOCH: 1
ALTAIR_FORK_VERSION: 0x20000090

# Bellatrix (Merge)
BELLATRIX_FORK_EPOCH: 2
BELLATRIX_FORK_VERSION: 0x20000091

# Capella
# Transition: 60 minutes * 60 seconds / 6 seconds per slot / 8 slots per epoch (=75 epochs)
# Transition + (28 minutes * 60 seconds / 6 seconds per slot / 8 slots per epoch (= 35 epochs))
CAPELLA_FORK_EPOCH: 503609
CAPELLA_FORK_VERSION: 0x20000092

# # Deneb
DENEB_FORK_EPOCH: 503609
DENEB_FORK_VERSION: 0x20000093

# Future forks
# Electra
ELECTRA_FORK_VERSION: 0x20000094
ELECTRA_FORK_EPOCH: 18446744073709551615
# # [New in Electra:EIP7251]
# # 1 * 17500 * 10**9 (= 17,500,000,000,000)
# MIN_PER_EPOCH_CHURN_LIMIT_ELECTRA: 17500000000000
# # 2 * 35000 * 10**9 (= 70,000,000,000,000)
# MAX_PER_EPOCH_ACTIVATION_EXIT_CHURN_LIMIT: 70000000000000

# Fulu (EIP-7594 / PeerDAS) and Gloas (EIP-7732 / ePBS).
# Required from Prysm v7 onward. This file sets PRESET_BASE: mainnet, so any key it
# does not define is inherited from Ethereum mainnet -- and the inherited versions
# (0x06000000 / 0x07000000) collide with Ethereum's own registered config, so the
# node refuses to start:
#   version 0x06000000 for fork fulu in config vana conflicts with existing
#   config named=mainnet
# Both are disabled with a far-future epoch, so the versions are never used as
# signing domains and neither fork enters the fork schedule. Verified on a live
# mainnet node: genesis_validators_root and the Deneb fork digest are unchanged.
# These supersede the commented-out EIP7594_/EIP7732_ stubs below.
FULU_FORK_VERSION: 0x20000095
FULU_FORK_EPOCH: 18446744073709551615
GLOAS_FORK_VERSION: 0x20000096
GLOAS_FORK_EPOCH: 18446744073709551615

# Blob-parameter-only (BPO) fork schedule, deliberately empty.
# An absent key inherits Ethereum mainnet's BPO forks at epochs 412672 and 419072.
# A BPO entry only gets a distinct fork digest when its epoch is at or after
# FULU_FORK_EPOCH; Fulu is disabled here, so those entries instead reuse the
# preceding fork's digest. Prysm's allTopics() walks the fork schedule and stops at
# the first repeated digest, so the gossip allowlist never reaches Capella/Deneb and
# the node then refuses every gossip topic ("topic is not allowed by the
# subscription filter"). It still starts and follows the chain by range sync, so the
# failure is quiet: no gossip participation and a drifting sync distance.
BLOB_SCHEDULE: []

# # EIP7594 - Peerdas
# EIP7594_FORK_VERSION: 0x60000039
# EIP7594_FORK_EPOCH: 18446744073709551615

# # WHISK
# WHISK_FORK_VERSION: 0x08000000  # temporary stub
# WHISK_FORK_EPOCH: 18446744073709551615
# # EIP7732
# EIP7732_FORK_VERSION: 0x09000000  # temporary stub
# EIP7732_FORK_EPOCH: 18446744073709551615

# Misc
# ---------------------------------------------------------------
MAX_COMMITTEES_PER_SLOT: 4
TARGET_COMMITTEE_SIZE: 8
MAX_VALIDATORS_PER_COMMITTEE: 20

# Time parameters
# ---------------------------------------------------------------
SECONDS_PER_SLOT: 6
# Prysm v7+ reads SLOT_DURATION_MS in preference to SECONDS_PER_SLOT for all slot
# timing. Left unset it inherits Ethereum mainnet's 12000, so the node does 12s/slot
# arithmetic on a 6s chain and dies with "invalid payload timestamp" -- while
# /eth/v1/config/spec still reports SECONDS_PER_SLOT: 6, which makes it look correct.
SLOT_DURATION_MS: 6000
SLOTS_PER_EPOCH: 8
EPOCHS_PER_SYNC_COMMITTEE_PERIOD: 8
ETH1_FOLLOW_DISTANCE: 32

# Execution
# ---------------------------------------------------------------
# Maximum number of withdrawals included in a block
# Use the default value of 2**4 (= 16)
MAX_WITHDRAWALS_PER_PAYLOAD: 16

# Withdrawals
# ---------------------------------------------------------------
# Maximum number of validators a node will search through to find sufficient withdrawals to include
# 2**10 (= 1024) validators
MAX_VALIDATORS_PER_WITHDRAWALS_SWEEP: 1024

# Validator cycle
# ---------------------------------------------------------------
MIN_PER_EPOCH_CHURN_LIMIT: 2
# 21 validators * 2 can churn per epoch = 42
CHURN_LIMIT_QUOTIENT: 42
# 17500 * 10**9 (= 17,500,000,000,000) Gwei
EJECTION_BALANCE: 17500000000000

# Deposit contract (PoS)
# ---------------------------------------------------------------
DEPOSIT_CHAIN_ID: 1480
DEPOSIT_NETWORK_ID: 1480

# The deposit contract changes at block 10,229,958.
#
# DEPOSIT_CONTRACT_ADDRESS is the contract that is authoritative from the switch block onward.
# RETIRED_DEPOSIT_CONTRACT_ADDRESS is the one that holds the deposit history before it -- its logs
# are still part of this chain's history and are still scanned, so a node syncing from genesis
# builds the same deposit trie it always did.
#
# The new contract was deployed (block 10,099,568) already seeded with the retired contract's final
# state: deposit count 32 and root 0x60dff8f6a92d68799e7653acdcefa253a1c2603b4dd071d8265491b465172401,
# with all 32 branch slots copied. The merkle index therefore continues across the boundary rather
# than restarting at 0, which is what lets the switch happen without rebuilding any node's deposit
# history. Both values were verified on chain against the retired contract.
#
# Below the switch block a node scans only the retired contract; at and above it, only the current
# one. A batch that straddles the boundary is split into two queries, one per contract.
#
# REQUIRES the Vana build of Prysm -- see the beacon service in docker-compose.yml. Upstream Prysm
# does not know these two keys, so it would scan the current contract for all of history, find no
# deposits below the switch block, and reject the first deposit above it with an incorrect merkle
# index. It also refuses to start at all once DEPOSIT_CONTRACT_ADDRESS no longer matches the
# address recorded in its own database.
DEPOSIT_CONTRACT_ADDRESS: 0xB98aafa6684aef18AEf518772F01F5aE0DA5eA4C
RETIRED_DEPOSIT_CONTRACT_ADDRESS: 0x17BbE91c315Bf14f38F6D35052a827cadfFe184e
DEPOSIT_CONTRACT_SWITCH_BLOCK: 10229958

# Gwei values
# ---------------------------------------------------------------
# 1000 * 10**9 (= 1,000,000,000,000) Gwei
MIN_DEPOSIT_AMOUNT: 1000000000000
# 35000 * 10**9 (= 35,000,000,000,000) Gwei
# Mainly for Electra, but since Deneb, Prysm uses MIN_ACTIVATION_BALANCE 
# to determine if a validator is active
MIN_ACTIVATION_BALANCE: 35000000000000
# 35000 * 10**9 (= 35,000,000,000,000) Gwei
MAX_EFFECTIVE_BALANCE: 35000000000000
# 1000 * 10**9 (= 1,000,000,000,000) Gwei
EFFECTIVE_BALANCE_INCREMENT: 1000000000000

# Reward and penalty quotients
# ---------------------------------------------------------------
BASE_REWARD_FACTOR: 21

# 2**24 (= 16,777,216) initial reference from Ethereum...
# 2**24 * 8 (~= 134,217,728) to decrease the penalty by 8x to account for epochs being 8x faster
INACTIVITY_PENALTY_QUOTIENT_BELLATRIX: 134217728

# MAXIMUM_EFFECTIVE_BALANCE / MIN_SLASHING_PENALTY_QUOTIENT
# 35,000 / 35 = 1000 VANA token slashing penalty
MIN_SLASHING_PENALTY_QUOTIENT_BELLATRIX: 35